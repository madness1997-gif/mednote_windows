name: Build native MedNote Reader

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore core tests
        run: dotnet restore tests/MedNote.Core.Tests/MedNote.Core.Tests.csproj
      - name: Test core contracts and performance algorithms
        run: dotnet test tests/MedNote.Core.Tests/MedNote.Core.Tests.csproj -c Release --no-restore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Windows solution
        run: dotnet restore MedNote.Windows.sln -p:Platform=x64
      - name: Test native core
        run: dotnet test tests/MedNote.Core.Tests/MedNote.Core.Tests.csproj -c Release --no-restore
      - name: Build WinUI application
        run: dotnet build src/MedNote.Windows.App/MedNote.Windows.App.csproj -c Release -p:Platform=x64 --no-restore
      - name: Publish self-contained x64 folder
        run: >-
          dotnet publish src/MedNote.Windows.App/MedNote.Windows.App.csproj
          -c Release -r win-x64 --self-contained true -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false
          -o artifacts/MedNote-Reader-Windows
      - name: Smoke-test packaged app startup and PDF rendering
        shell: pwsh
        run: |
          $smokePdf = Join-Path $env:RUNNER_TEMP "mednote-render-smoke.pdf"
          $largePdf = Join-Path $env:RUNNER_TEMP "mednote-render-3000-pages.pdf"
          $adversarialPdf = Join-Path $env:RUNNER_TEMP "mednote-adversarial-corpus.pdf"
          $rotationPdf = Join-Path $env:RUNNER_TEMP "mednote-rotation-corpus.pdf"
          $encryptedPdf = Join-Path $env:RUNNER_TEMP "mednote-encrypted.pdf"
          $base64 = (Get-Content tests/fixtures/render-smoke.pdf.base64 -Raw).Trim()
          [IO.File]::WriteAllBytes($smokePdf, [Convert]::FromBase64String($base64))
          $encryptedBase64 = (Get-Content tests/fixtures/encrypted-password-mednote.pdf.base64 -Raw).Trim()
          [IO.File]::WriteAllBytes($encryptedPdf, [Convert]::FromBase64String($encryptedBase64))
          & tests/fixtures/New-MixedPagePdf.ps1 -Path $largePdf -PageCount 3000
          & tests/fixtures/New-AdversarialPdfCorpus.ps1 -Path $adversarialPdf
          & tests/fixtures/New-RotatedPdfCorpus.ps1 -Path $rotationPdf

          function Invoke-MedNoteRenderSmoke {
            param(
              [Parameter(Mandatory = $true)][string]$PdfPath,
              [Parameter(Mandatory = $true)][int]$TargetPage,
              [Parameter(Mandatory = $true)][int]$ExpectedPages,
              [Parameter(Mandatory = $true)][string]$ProbeName,
              [switch]$ExpectSurfaceRecovery,
              [switch]$RequireInk,
              [int]$Rotation = 0,
              [ValidateSet("Any", "Portrait", "Landscape")][string]$ExpectedOrientation = "Any",
              [string]$ExpectedCorners,
              [string]$Password
            )

            $startedAt = Get-Date
            $renderProbe = Join-Path $env:RUNNER_TEMP $ProbeName
            Remove-Item $renderProbe -Force -ErrorAction SilentlyContinue
            $env:MEDNOTE_RENDER_PROBE = $renderProbe
            $env:MEDNOTE_RENDER_TARGET_PAGE = $TargetPage.ToString()
            $env:MEDNOTE_RENDER_ROTATION = $Rotation.ToString()
            if ($ExpectSurfaceRecovery) {
              $env:MEDNOTE_SIMULATE_SURFACE_LOSS = "1"
            } else {
              Remove-Item Env:MEDNOTE_SIMULATE_SURFACE_LOSS -ErrorAction SilentlyContinue
            }
            if ($Password) {
              $env:MEDNOTE_PDF_PASSWORD = $Password
            } else {
              Remove-Item Env:MEDNOTE_PDF_PASSWORD -ErrorAction SilentlyContinue
            }
            $process = Start-Process artifacts/MedNote-Reader-Windows/MedNote.Reader.exe `
              -ArgumentList "`"$PdfPath`"" -PassThru

            try {
              $rendered = $false
              foreach ($attempt in 1..45) {
                Start-Sleep -Seconds 1
                if ($process.HasExited) { break }
                if (Test-Path $renderProbe) {
                  $rendered = $true
                  break
                }
              }

              if ($process.HasExited) {
                $startupLog = Join-Path $env:LOCALAPPDATA "MedNote Reader/startup-crash.log"
                if (Test-Path $startupLog) {
                  Write-Host "--- MedNote startup crash log ---"
                  Get-Content $startupLog
                }

                Write-Host "--- Relevant Windows Application events ---"
                Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $startedAt } -ErrorAction SilentlyContinue |
                  Where-Object { $_.Message -match 'MedNote.Reader|Microsoft.UI.Xaml|stowed' } |
                  Select-Object -First 10 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
                  Format-List | Out-String | Write-Host

                throw "MedNote.Reader.exe exited during startup with code $($process.ExitCode)"
              }

              if (-not $rendered) {
                $startupLog = Join-Path $env:LOCALAPPDATA "MedNote Reader/startup-crash.log"
                if (Test-Path $startupLog) {
                  Write-Host "--- MedNote startup/render diagnostic log ---"
                  Get-Content $startupLog
                }
                throw "MedNote opened but did not render page $TargetPage within 45 seconds"
              }

              $probe = (Get-Content $renderProbe -Raw).Trim()
              Write-Host "PDF render probe: $probe"
              if ($probe -notmatch '^surface=direct2d;page=(\d+);pages=(\d+);width=(\d+);height=(\d+);bytes=\d+;workingSet=(\d+);elapsedMs=(\d+);presentations=(\d+);inkSamples=(\d+);rotation=(\d+);corners=([RGBKW?]{4})$') {
                throw "Invalid Direct2D render probe: $probe"
              }

              $renderedPage = [int]$Matches[1]
              $documentPages = [int]$Matches[2]
              $pixelWidth = [int]$Matches[3]
              $pixelHeight = [int]$Matches[4]
              $workingSet = [long]$Matches[5]
              $elapsedMilliseconds = [long]$Matches[6]
              $presentations = [int]$Matches[7]
              $inkSamples = [int]$Matches[8]
              $renderedRotation = [int]$Matches[9]
              $cornerSignature = $Matches[10]
              $expectedRotation = (($Rotation % 360) + 360) % 360
              $expectedRotation = [int]([Math]::Round($expectedRotation / 90.0) * 90) % 360
              if ($renderedPage -ne $TargetPage -or $documentPages -ne $ExpectedPages) {
                throw "Unexpected rendered page/document count: $renderedPage/$documentPages"
              }
              if ($renderedRotation -ne $expectedRotation) {
                throw "Unexpected Reader rotation: $renderedRotation (expected $expectedRotation)"
              }
              if ($ExpectedOrientation -eq "Portrait" -and $pixelWidth -ge $pixelHeight) {
                throw "Expected portrait bitmap, received ${pixelWidth}x${pixelHeight}"
              }
              if ($ExpectedOrientation -eq "Landscape" -and $pixelWidth -le $pixelHeight) {
                throw "Expected landscape bitmap, received ${pixelWidth}x${pixelHeight}"
              }
              if ($ExpectedCorners -and $cornerSignature -ne $ExpectedCorners) {
                throw "Unexpected corner signature: $cornerSignature (expected $ExpectedCorners)"
              }
              if ($workingSet -gt 805306368) {
                throw "Working set exceeded the 768 MiB smoke-test ceiling: $workingSet bytes"
              }
              if ($elapsedMilliseconds -gt 45000) {
                throw "Render probe exceeded the 45-second ceiling: $elapsedMilliseconds ms"
              }
              if ($ExpectSurfaceRecovery -and $presentations -lt 2) {
                throw "Direct2D surface recovery did not present the page twice"
              }
              if ($RequireInk -and $inkSamples -le 0) {
                throw "Rendered corpus page contains no sampled non-white pixels"
              }

              # Query child processes only while the exact app process is still alive.
              # The hosted Windows runner can recycle a just-exited PID for system
              # processes between the render probe and this diagnostic check.
              $process.Refresh()
              if (-not $process.HasExited) {
                $children = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($process.Id)"
                $process.Refresh()
                if (-not $process.HasExited -and $children) {
                  throw "Unexpected child process(es): $($children.Name -join ', ')"
                }
              }
            } finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          }

          Invoke-MedNoteRenderSmoke -PdfPath $smokePdf -TargetPage 1 -ExpectedPages 1 `
            -ProbeName "mednote-render-small.txt" -ExpectSurfaceRecovery
          Invoke-MedNoteRenderSmoke -PdfPath $largePdf -TargetPage 1500 -ExpectedPages 3000 `
            -ProbeName "mednote-render-large.txt"
          Invoke-MedNoteRenderSmoke -PdfPath $adversarialPdf -TargetPage 1 -ExpectedPages 4 `
            -ProbeName "mednote-render-table.txt" -RequireInk
          Invoke-MedNoteRenderSmoke -PdfPath $adversarialPdf -TargetPage 2 -ExpectedPages 4 `
            -ProbeName "mednote-render-scan.txt" -RequireInk
          Invoke-MedNoteRenderSmoke -PdfPath $adversarialPdf -TargetPage 3 -ExpectedPages 4 `
            -ProbeName "mednote-render-zero-crop.txt"
          Invoke-MedNoteRenderSmoke -PdfPath $adversarialPdf -TargetPage 4 -ExpectedPages 4 `
            -ProbeName "mednote-render-extreme-box.txt"
          Invoke-MedNoteRenderSmoke -PdfPath $encryptedPdf -TargetPage 1 -ExpectedPages 1 `
            -ProbeName "mednote-render-encrypted.txt" -Password "mednote"
          Invoke-MedNoteRenderSmoke -PdfPath $rotationPdf -TargetPage 1 -ExpectedPages 4 `
            -ProbeName "mednote-rotation-intrinsic-0.txt" -ExpectedOrientation Portrait -ExpectedCorners RGBK
          Invoke-MedNoteRenderSmoke -PdfPath $rotationPdf -TargetPage 2 -ExpectedPages 4 `
            -ProbeName "mednote-rotation-intrinsic-90.txt" -ExpectedOrientation Landscape -ExpectedCorners KRGB
          Invoke-MedNoteRenderSmoke -PdfPath $rotationPdf -TargetPage 3 -ExpectedPages 4 `
            -ProbeName "mednote-rotation-intrinsic-180.txt" -ExpectedOrientation Portrait -ExpectedCorners BKRG
          Invoke-MedNoteRenderSmoke -PdfPath $rotationPdf -TargetPage 4 -ExpectedPages 4 `
            -ProbeName "mednote-rotation-intrinsic-270.txt" -ExpectedOrientation Landscape -ExpectedCorners GBKR
          Invoke-MedNoteRenderSmoke -PdfPath $rotationPdf -TargetPage 1 -ExpectedPages 4 `
            -ProbeName "mednote-rotation-reader-90.txt" -Rotation 90 -ExpectedOrientation Landscape -ExpectedCorners KRGB
          Invoke-MedNoteRenderSmoke -PdfPath $rotationPdf -TargetPage 1 -ExpectedPages 4 `
            -ProbeName "mednote-rotation-reader-180.txt" -Rotation 180 -ExpectedOrientation Portrait -ExpectedCorners BKRG
          Invoke-MedNoteRenderSmoke -PdfPath $rotationPdf -TargetPage 1 -ExpectedPages 4 `
            -ProbeName "mednote-rotation-reader-270.txt" -Rotation 270 -ExpectedOrientation Landscape -ExpectedCorners GBKR
          Remove-Item Env:MEDNOTE_RENDER_PROBE -ErrorAction SilentlyContinue
          Remove-Item Env:MEDNOTE_RENDER_TARGET_PAGE -ErrorAction SilentlyContinue
          Remove-Item Env:MEDNOTE_RENDER_ROTATION -ErrorAction SilentlyContinue
          Remove-Item Env:MEDNOTE_SIMULATE_SURFACE_LOSS -ErrorAction SilentlyContinue
          Remove-Item Env:MEDNOTE_PDF_PASSWORD -ErrorAction SilentlyContinue
      - name: Verify native artifact boundary
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts/MedNote-Reader-Windows/MedNote.Reader.exe -ErrorAction Stop
          if (-not $exe) { throw "MedNote.Reader.exe was not published" }

          $pdfium = Get-ChildItem artifacts/MedNote-Reader-Windows -Recurse -File -Filter pdfium.dll
          if (-not $pdfium) { throw "PDFium native runtime was not published" }

          $win2d = Get-ChildItem artifacts/MedNote-Reader-Windows -Recurse -File -Filter Microsoft.Graphics.Canvas.dll
          if (-not $win2d) { throw "Win2D Direct2D runtime was not published" }

          $webReferences = Get-ChildItem src -Recurse -File -Include *.cs,*.xaml,*.csproj |
            Select-String -Pattern 'WebView2|Microsoft\.Web\.WebView2'
          if ($webReferences) { throw "WebView2 reference found in native source: $($webReferences.Path -join ', ')" }

          $milestoneRenderer = Get-ChildItem src -Recurse -File -Include *.cs,*.csproj |
            Select-String -Pattern 'Windows\.Data\.Pdf|WindowsPdfEngine'
          if ($milestoneRenderer) {
            throw "Milestone PDF renderer still exists: $($milestoneRenderer.Path -join ', ')"
          }

          $encodedSurfacePipeline = Get-ChildItem src -Recurse -File -Include *.cs,*.csproj |
            Select-String -Pattern 'BitmapEncoder|PngEncoderId|BitmapImage|SetSourceAsync|InMemoryRandomAccessStream'
          if ($encodedSurfacePipeline) {
            throw "Encoded image pipeline returned: $($encodedSurfacePipeline.Path -join ', ')"
          }

          $notice = Get-ChildItem artifacts/MedNote-Reader-Windows/THIRD-PARTY-NOTICES.md -ErrorAction Stop
          if (-not $notice) { throw "Third-party notices were not published" }

          # Windows App SDK publishes this optional loader even when WebView2 is unused.
          # Remove it so the distributed reader contains no dormant web runtime bridge.
          Get-ChildItem artifacts/MedNote-Reader-Windows -Recurse -File -Filter WebView2Loader.dll |
            Remove-Item -Force

          $forbidden = Get-ChildItem artifacts/MedNote-Reader-Windows -Recurse -File |
            Where-Object { $_.Name -match 'electron|webview2loader|chrome|chromium' }
          if ($forbidden) { throw "Web runtime leaked into native artifact: $($forbidden.Name -join ', ')" }
          Compress-Archive -Path artifacts/MedNote-Reader-Windows/* -DestinationPath artifacts/MedNote-Reader-Windows-x64.zip -Force
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build versioned Windows installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/MedNote.Windows.App/MedNote.Windows.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "App Version must be numeric for the Windows installer: '$version'"
          }

          $publishDir = (Resolve-Path artifacts/MedNote-Reader-Windows).Path
          $outputDir = New-Item artifacts/installer -ItemType Directory -Force
          & ISCC.exe `
            "--define=AppVersion=$version" `
            "--define=SourceDir=$publishDir" `
            "--define=OutputDir=$($outputDir.FullName)" `
            installer/MedNote.Reader.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler failed with exit code $LASTEXITCODE"
          }
      - name: Smoke-test install, launch and safe uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/installer/MedNote-Reader-Setup-*-x64.exe -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $installer = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP "MedNoteReaderInstalled"
          $installLog = Join-Path $env:RUNNER_TEMP "mednote-install.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "mednote-uninstall.log"
          $dataDir = Join-Path $env:LOCALAPPDATA "MedNote Reader"
          $dataSentinel = Join-Path $dataDir "installer-preserves-user-data.txt"
          New-Item $dataDir -ItemType Directory -Force | Out-Null
          Set-Content $dataSentinel "preserve-on-uninstall" -Encoding ascii

          $setup = Start-Process $installer.FullName -Wait -PassThru -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installDir",
            "/LOG=$installLog"
          )
          if ($setup.ExitCode -ne 0) {
            Get-Content $installLog -ErrorAction SilentlyContinue
            throw "Installer exited with code $($setup.ExitCode)"
          }

          $installedExe = Join-Path $installDir "MedNote.Reader.exe"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed application executable is missing" }
          if (-not (Test-Path $uninstaller)) { throw "Installed uninstaller is missing" }

          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\MedNote Reader.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut is missing" }

          $uninstallEntry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall -ErrorAction Stop |
            Get-ItemProperty |
            Where-Object DisplayName -eq "MedNote Reader"
          if (-not $uninstallEntry) { throw "Apps & Features uninstall entry is missing" }

          $smokePdf = Join-Path $env:RUNNER_TEMP "mednote-installed-smoke.pdf"
          $renderProbe = Join-Path $env:RUNNER_TEMP "mednote-installed-smoke.txt"
          $base64 = (Get-Content tests/fixtures/render-smoke.pdf.base64 -Raw).Trim()
          [IO.File]::WriteAllBytes($smokePdf, [Convert]::FromBase64String($base64))
          $env:MEDNOTE_RENDER_PROBE = $renderProbe
          $env:MEDNOTE_RENDER_TARGET_PAGE = "1"
          $app = Start-Process $installedExe -ArgumentList "`"$smokePdf`"" -PassThru
          try {
            foreach ($attempt in 1..45) {
              Start-Sleep -Seconds 1
              if ($app.HasExited -or (Test-Path $renderProbe)) { break }
            }
            if ($app.HasExited) { throw "Installed MedNote Reader exited with code $($app.ExitCode)" }
            if (-not (Test-Path $renderProbe)) { throw "Installed MedNote Reader did not render the smoke PDF" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            Remove-Item Env:MEDNOTE_RENDER_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:MEDNOTE_RENDER_TARGET_PAGE -ErrorAction SilentlyContinue
          }

          $uninstall = Start-Process $uninstaller -Wait -PassThru -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/LOG=$uninstallLog"
          )
          if ($uninstall.ExitCode -ne 0) {
            Get-Content $uninstallLog -ErrorAction SilentlyContinue
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }

          foreach ($attempt in 1..20) {
            if (-not (Test-Path $installDir)) { break }
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installDir) { throw "Application install directory remains after uninstall" }
          if (Test-Path $shortcut) { throw "Start Menu shortcut remains after uninstall" }
          $remainingUninstallEntry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall -ErrorAction Stop |
            Get-ItemProperty |
            Where-Object DisplayName -eq "MedNote Reader"
          if ($remainingUninstallEntry) { throw "Apps & Features entry remains after uninstall" }
          if (-not (Test-Path $dataSentinel)) { throw "Uninstall removed user data" }
          Remove-Item $dataSentinel -Force
      - name: Generate release checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/installer/MedNote-Reader-Setup-*-x64.exe -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $assets = @(
            Get-Item artifacts/MedNote-Reader-Windows-x64.zip
            $installers[0]
          )
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $checksums | Set-Content artifacts/MedNote-Reader-Windows-x64.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MedNote-Reader-Native-Windows-x64
          path: |
            artifacts/installer/MedNote-Reader-Setup-*-x64.exe
            artifacts/MedNote-Reader-Windows-x64.zip
            artifacts/MedNote-Reader-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish rolling preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-preview"
          git tag --force $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

          $installers = @(Get-ChildItem artifacts/installer/MedNote-Reader-Setup-*-x64.exe -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $installer = $installers[0]
          $assets = @(
            $installer.FullName,
            "artifacts/MedNote-Reader-Windows-x64.zip",
            "artifacts/MedNote-Reader-Windows-x64.sha256"
          )
          $notes = "Install with the versioned Setup EXE. The ZIP remains available for portable use. Uninstalling removes application files and shortcuts while preserving user notes under %LOCALAPPDATA%\MedNote Reader. Preview builds are currently unsigned."

          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --prerelease --title "MedNote Reader Windows Preview" `
              --notes $notes --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets `
              --prerelease --title "MedNote Reader Windows Preview" `
              --notes $notes `
              --repo $env:GITHUB_REPOSITORY
          }
